name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: able2
          POSTGRES_PASSWORD: able2password
          POSTGRES_DB: able2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Create test directories
        run: |
          mkdir -p data/vector_store data/graph_store data/uploads logs temp

      - name: Run tests
        env:
          DATABASE_URL: postgresql://able2:able2password@localhost:5432/able2_test
          ANTHROPIC_API_KEY: test-key-not-real
          ABLE2_API_KEY: test-api-key-for-ci
          API_KEY_ENABLED: "true"
          PATH_UPLOADS: ./data/uploads
          PATH_VECTOR_STORE: ./data/vector_store
          PATH_GRAPH_STORE: ./data/graph_store
          PATH_LOGS: ./logs
          SEARXNG_ENABLED: "false"
        run: |
          cd Able2
          python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy

      - name: Check formatting with Black
        run: |
          cd Able2
          black --check --diff backend/ tests/ || echo "Formatting issues found (non-blocking)"

      - name: Lint with Flake8
        run: |
          cd Able2
          flake8 backend/ tests/ --max-line-length=120 --ignore=E501,W503 --exit-zero

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security scanner
        run: pip install bandit safety

      - name: Run Bandit security scan
        run: |
          cd Able2
          bandit -r backend/ -ll --exit-zero

      - name: Check dependencies for vulnerabilities
        run: |
          cd Able2
          pip install -r requirements.txt
          safety check --full-report || echo "Dependency vulnerabilities found (review needed)"
